name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: cd web && npm ci --no-audit --no-fund
      - run: cd web && node --test
      # The committed bundle must match web/: Omniscient runs exactly this file.
      - run: cd web && npm run build && git diff --exit-code ../src/prophet_soul/omniscient.js
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
